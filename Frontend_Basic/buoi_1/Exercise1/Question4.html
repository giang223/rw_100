<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Question4</title>
  </head>
  <body>
    <h1>Register</h1>
    <p>
      <i>Please <b>fill in this form</b> to create an account</i>
    </p>
    <form>
      <div>
        <label>Full name <span style="color: red">*</span> </label><br />
        <input type="text" placeholder="Input your fullname..." />
      </div>
      <br />
      <div>
        <label>Username <span style="color: red">*</span></label> <br />
        <input type="text" placeholder="Input your username..." />
      </div>
      <br />

      <div>
        <label>Password <span style="color: red">*</span></label> <br />
        <input type="password" placeholder="Input your password..." />
      </div>
      <br />

      <div>
        <label>Email <span style="color: red">*</span></label
        ><br />
        <input type="email" placeholder="Input your email..." />
      </div>
      <br />

      <div>
        <label>Telephone number <span style="color: red">*</span></label> <br />
        <input type="tel" placeholder="Input your phone number..." />
      </div>
      <br />

      <div>
        <label>Input Object:</label><br />
        <input type="radio" name="object" id="student" />
        <label for="student">Student</label>
        <input type="radio" name="object" id="teacher" />
        <label for="teacher">Teacher</label>
      </div>
      <br />

      <div>
        <label>Favorite:</label><br />
        <input type="checkbox" id="badminton" />
        <label for="badminton">Badminton</label>
        <input type="checkbox" id="volleyball" />
        <label for="volleyball">Volleyball</label>
        <input type="checkbox" id="football" />
        <label for="football">Football</label>
      </div>
      <br />

      <div>
        <label>Address <span style="color: red">*</span></label> <br />
        <select>
          <option>Bắc Giang</option>
          <option>Hà Nội</option>
          <option>Thành phố HCM</option>
        </select>
      </div>
      <br />

      <div>
        <label>Your picture <span style="color: red">*</span></label> <br />
        <input type="file" />
      </div>
      <br />

      <div>
        <button type="submit">Đăng ký</button>
      </div>
    </form>
  </body>
</html>
